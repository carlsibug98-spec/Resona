<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resona</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0b0d;
    color: #e8e8ea;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; user-select: none;
  }
  .logo {
    width: 72px; height: 72px; border-radius: 18px;
    background: linear-gradient(135deg, #1ed760, #0e8f43);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 40px; color: #04140a;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
  p { margin: 0; color: #9a9aa2; font-size: 13px; max-width: 460px; text-align: center; line-height: 1.5; }
  .spin {
    width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid #26262b; border-top-color: #1ed760;
    animation: s 0.9s linear infinite;
  }
  @keyframes s { to { transform: rotate(360deg); } }
  .err {
    display: none; background: #1a1214; border: 1px solid #4a2229;
    color: #f0b8bf; padding: 10px 14px; border-radius: 8px; font-size: 12px;
    max-width: 520px; text-align: center; word-break: break-word;
  }
</style>
</head>
<body>
  <div class="logo">R</div>
  <h1>Resona</h1>
  <div class="spin" id="spin"></div>
  <p id="msg">Starting the music server…</p>
  <div class="err" id="err"></div>
  <script>
    // The Rust shell opens this splash first, then boots the Node sidecar.
    // Readiness is reported from the RUST side, two ways:
    //   1. a `server-ready` event pushed once the port answers (fast path)
    //   2. an IPC `server_ready` command polled here (fallback — events are
    //      not sticky, a fast boot can beat this listener)
    // The webview must NOT probe the server with fetch(): from the bundled
    // page origin (tauri://localhost / http://tauri.localhost) that request
    // is cross-origin and the Next standalone server sends no CORS headers,
    // so it rejects forever even while the server is up — the v1.7.10 bug
    // that wedged this splash on "Starting the music server…" for minutes.
    (function () {
      var started = Date.now();
      var done = false;
      function msg(text) {
        document.getElementById("msg").textContent = text;
      }
      function go(url) {
        if (done) return;
        done = true;
        msg("Opening Resona…");
        location.href = url;
      }
      function fail(why) {
        if (done) return;
        done = true;
        document.getElementById("spin").style.display = "none";
        msg("Resona could not start its music server.");
        var e = document.getElementById("err");
        e.textContent = why;
        e.style.display = "block";
      }
      function pollLoop() {
        if (!window.__TAURI__ || !window.__TAURI__.core) {
          setTimeout(pollLoop, 400);
          return;
        }
        var T = window.__TAURI__;
        // 1) the push path — the shell emits this the moment the port answers
        if (T.event && T.event.listen) {
          T.event.listen("server-ready", function (e) { go(e.payload); });
        }
        // 2) the pull path — poll the Rust-side TCP probe
        function poll() {
          if (done) return;
          var secs = Math.round((Date.now() - started) / 1000);
          if (secs >= 8) msg("Still starting — first launch can take a little longer…");
          if (secs >= 30) msg("Still starting… if this never finishes, check the server log.");
          T.core.invoke("server_ready").then(function (up) {
            if (done) return;
            if (up) {
              T.core.invoke("server_url").then(go, function (e) { fail("server_url failed: " + e); });
            } else if (secs >= 90) {
              fail(
                "The bundled music server never opened its port within 90 s. " +
                "Check the log for details — C:\\Resona\\logs\\server.log on Windows, " +
                "~/.config/Resona/logs/server.log on Linux."
              );
            } else {
              setTimeout(poll, 600);
            }
          }).catch(function (e) {
            if (!done && secs >= 90) fail(String(e));
            else setTimeout(poll, 600);
          });
        }
        poll();
      }
      pollLoop();
    })();
  </script>
</body>
</html>
