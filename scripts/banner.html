<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1280px; height:640px; background:#0a0a0a; overflow:hidden; position:relative;
  font-family:'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif; color:#f2f2f2;
  -webkit-font-smoothing: antialiased;
}
.glow {
  position:absolute; inset:-30% -10% auto; height:150%;
  background:
    radial-gradient(45% 55% at 28% 18%, rgba(30,215,96,.16), transparent 70%),
    radial-gradient(38% 48% at 88% 85%, rgba(30,215,96,.08), transparent 70%);
}
.inner { position:relative; display:flex; height:100%; align-items:center; padding:0 64px; gap:24px; }
.left { width:600px; flex:none; }
.logo-row { display:flex; align-items:center; gap:22px; }
.logo-mark {
  width:100px; height:100px; border-radius:24px; flex:none;
  background:linear-gradient(135deg,#3a3a3a,#0c0c0c);
  border:1px solid rgba(255,255,255,.12);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 24px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12);
}
h1 { font-size:72px; font-weight:800; letter-spacing:-3px; line-height:1; }
.tagline { margin-top:20px; font-size:21px; color:#b8b8b8; line-height:1.45; max-width:500px; }
.chips { margin-top:28px; display:flex; gap:10px; flex-wrap:wrap; }
.chip {
  padding:9px 18px; border:1px solid rgba(255,255,255,.14); border-radius:999px;
  font-size:15px; font-weight:600; color:#c9c9c9; background:rgba(255,255,255,.03);
}
.chip i { color:#1ed760; font-style:normal; margin-right:7px; }
.repo { margin-top:44px; font-size:15px; color:#8a8a8a; letter-spacing:.2px; }
.repo b { color:#1ed760; font-weight:600; }
/* devices */
.devices { position:relative; flex:1; height:100%; }
.laptop { position:absolute; right:70px; top:126px; width:462px; }
.laptop .screen {
  border:2px solid #2c2c2c; border-radius:14px 14px 0 0; overflow:hidden; background:#111;
  box-shadow:0 40px 100px rgba(0,0,0,.65);
}
.laptop img { display:block; width:100%; }
.laptop .base {
  height:13px; background:linear-gradient(180deg,#313131,#161616);
  border-radius:2px 2px 15px 15px; margin:0 -28px;
  border:2px solid #2c2c2c; border-top:0;
  box-shadow:0 30px 60px rgba(0,0,0,.5);
}
.laptop .base::after {
  content:""; display:block; width:110px; height:5px; margin:2px auto 0;
  border-radius:0 0 6px 6px; background:#0d0d0d;
}
.phone {
  position:absolute; right:10px; top:176px; width:160px;
  border:3px solid #2c2c2c; border-radius:30px; overflow:hidden; background:#000;
  box-shadow:0 40px 90px rgba(0,0,0,.75);
}
.phone img { display:block; width:100%; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="inner">
  <div class="left">
    <div class="logo-row">
      <div class="logo-mark">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1ed760" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4"/><path d="M8 6v12"/><path d="M12 3v18"/><path d="M16 6v12"/><path d="M20 10v4"/></svg>
      </div>
      <h1>Resona</h1>
    </div>
    <p class="tagline">Stream &amp; download high-quality music, free, no ads, no login.</p>
    <div class="chips">
      <span class="chip"><i>●</i> Open Source</span>
      <span class="chip"><i>●</i> Free</span>
      <span class="chip"><i>●</i> Ad-Free</span>
      <span class="chip">v1.2.0</span>
    </div>
    <p class="repo">github.com/<b>carlsibug98-spec</b>/Resona</p>
  </div>
  <div class="devices">
    <div class="laptop">
      <div class="screen"><img src="file:///home/z/my-project/download/screenshots/14-home-spotify-style.png"></div>
      <div class="base"></div>
    </div>
    <div class="phone">
      <img src="file:///home/z/my-project/download/screenshots/13-mobile-dark.png">
    </div>
  </div>
</div>
</body>
</html>
