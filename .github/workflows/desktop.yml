name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "desktop/**"
      - "scripts/stage-desktop.js"
      - "next.config.ts"
      - "package.json"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            builder: --win --x64
            artifact: Resona-Windows-Installer
            paths: |
              desktop/dist/Resona-Setup-*.exe
              desktop/dist/Resona-Setup-*.exe.blockmap
              desktop/dist/latest.yml
          - name: macOS dmg
            os: macos-latest
            builder: --mac --x64 --arm64
            artifact: Resona-macOS
            paths: |
              desktop/dist/*.dmg
              desktop/dist/*.dmg.blockmap
              desktop/dist/latest-mac.yml
          - name: Linux AppImage + deb
            os: ubuntu-latest
            builder: --linux --x64
            artifact: Resona-Linux
            paths: |
              desktop/dist/*.AppImage
              desktop/dist/*.AppImage.blockmap
              desktop/dist/*.deb
              desktop/dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install desktop packaging tools
        working-directory: desktop
        run: npm install

      - name: Build web app (standalone)
        run: npx next build

      - name: Generate app icons
        run: node scripts/make-icon.js

      - name: Stage desktop bundle
        run: node scripts/stage-desktop.js

      # Windows: set WINDOWS_CSC_LINK (base64 PFX) + WINDOWS_CSC_KEY_PASSWORD
      # as repo secrets and electron-builder signs the installer automatically.
      # Without them the build stays unsigned (SmartScreen warning, see SIGNING.md).
      - name: Build desktop app
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        # --publish never: resolve publish config so the electron-updater
        # metadata (latest*.yml) is generated without publishing anywhere
        run: npx electron-builder ${{ matrix.builder }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          compression-level: 0
