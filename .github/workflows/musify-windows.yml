name: Musify Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "musify-app/**"
      - ".github/workflows/musify-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: musify-app
    steps:
      - uses: actions/checkout@v5

      - name: Resolve Flutter version from musify-app/pubspec.yaml
        shell: bash
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/^  flutter: \^*//p' pubspec.yaml)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Archive Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath musify-app-windows-x64.zip

      - name: Extract app version
        id: ver
        shell: bash
        run: |
          echo "version=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (single Setup.exe)
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION=${{ steps.ver.outputs.version }} installer.iss'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: musify-app-windows-x64
          path: |
            musify-app/musify-app-windows-x64.zip
            musify-app/installer/Musify-Setup-*.exe
          if-no-files-found: error

      - name: Attach build to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          file: musify-app/musify-app-windows-x64.zip
          asset_name: musify-app-${{ steps.ver.outputs.version }}-windows-x64.zip
          tag: musify-app-v${{ steps.ver.outputs.version }}
          release_name: Musify (Resona UI) v${{ steps.ver.outputs.version }} - Windows
          body: |
            Windows build of the Musify Flutter app with the Resona UI
            (gokadzev/Musify v${{ steps.ver.outputs.version }}, GPL-3.0).

            - Musify-Setup-*.exe — one-file installer (recommended)
            - musify-app-*.zip — portable, unzip anywhere and run musify.exe

            Builds are unsigned, so SmartScreen may show "unknown publisher";
            choose More info > Run anyway.
          overwrite: true
          make_latest: true

      - name: Attach installer to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          file: musify-app/installer/Musify-Setup-${{ steps.ver.outputs.version }}.exe
          asset_name: Musify-Setup-${{ steps.ver.outputs.version }}.exe
          tag: musify-app-v${{ steps.ver.outputs.version }}
          overwrite: true
