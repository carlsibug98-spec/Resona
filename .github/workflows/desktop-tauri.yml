name: Build Resona-Tauri (Rust shell)

# The Rust/Tauri desktop shell (desktop-tauri/) — the same Next.js server
# bundle the Electron build stages, wrapped in a Tauri 2 window. Windows
# first (NSIS), Linux (AppImage + deb) second; both ride CI exactly like
# desktop.yml and musify-windows.yml do.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop-tauri/**"
      - ".github/workflows/desktop-tauri.yml"
      - "scripts/stage-desktop.js"
      - "package.json"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (Rust shell)
            os: windows-latest
            targets: nsis
            triple: x86_64-pc-windows-msvc
            tauri_config: tauri.win.conf.json
            ytdlp: yt-dlp.exe
            bundle_globs: |
              desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux (Rust shell)
            os: ubuntu-latest
            targets: appimage,deb
            triple: x86_64-unknown-linux-gnu
            tauri_config: tauri.linux.conf.json
            ytdlp: yt-dlp
            bundle_globs: |
              desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Linux system deps for Tauri (WebKitGTK etc.) — the runner's apt has sudo
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Install dependencies
        run: npm install

      - name: Build web app (standalone)
        run: npx next build

      - name: Stage desktop server bundle
        run: node scripts/stage-desktop.js

      # Reuse the EXACT staged server the Electron build ships: standalone
      # server + static + public, node_modules renamed to deps. Literal
      # directory resources (no globs) so dotfiles like .next/ ship intact.
      - name: Collect resources for the Tauri bundle
        shell: bash
        run: |
          mkdir -p desktop-tauri/src-tauri/resources
          cp -r desktop/staging/server desktop-tauri/src-tauri/resources/server
          cp "desktop/staging/${{ matrix.ytdlp }}" desktop-tauri/src-tauri/resources/ || true
          echo "resources ready:"; du -sh desktop-tauri/src-tauri/resources/server | head -1
          test -f desktop-tauri/src-tauri/resources/server/server.js
          test -d desktop-tauri/src-tauri/resources/server/deps

      # The sidecar: a real Node runtime (Tauri has none). externalBin wants
      # it at src-tauri/binaries/node-<triple>(.exe) — Tauri strips the triple
      # into binaries/node(.exe) inside the installed app.
      - name: Fetch Node sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-tauri/src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-x64.zip" -OutFile "$env:RUNNER_TEMP\node.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\node.zip" -DestinationPath "$env:RUNNER_TEMP\node-pkg" -Force
          Copy-Item "$env:RUNNER_TEMP\node-pkg\node-v22.14.0-win-x64\node.exe" "desktop-tauri/src-tauri/binaries/node-x86_64-pc-windows-msvc.exe"
          Get-ChildItem desktop-tauri/src-tauri/binaries/

      - name: Fetch Node sidecar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p desktop-tauri/src-tauri/binaries
          curl -sL --max-time 300 -o /tmp/node-pkg https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz
          tar -xf /tmp/node-pkg -C /tmp
          cp /tmp/node-v22.14.0-linux-x64/bin/node desktop-tauri/src-tauri/binaries/node-x86_64-unknown-linux-gnu
          ls -la desktop-tauri/src-tauri/binaries/

      - name: Build Tauri app
        working-directory: desktop-tauri
        shell: bash
        run: npx -y @tauri-apps/cli@latest build --bundles ${{ matrix.targets }} --config src-tauri/${{ matrix.tauri_config }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Resona-Tauri-${{ runner.os }}
          path: ${{ matrix.bundle_globs }}
          if-no-files-found: error
